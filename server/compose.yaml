name: cppchat

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_DATABASE: chatdb
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:latest
    command: ["redis-server", "--requirepass", "123456", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  verify-server:
    build:
      context: ./apps/verify-server
      dockerfile: Dockerfile
    environment:
      VERIFY_EMAIL_USER: "${VERIFY_EMAIL_USER:-}"
      VERIFY_EMAIL_PASS: "${VERIFY_EMAIL_PASS:-}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWD: "${REDIS_PASSWORD:-123456}"
    ports:
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy

  gate-server:
    build:
      context: ./apps/gate-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./apps/gate-server/config.compose.ini:/app/config.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      verify-server:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
